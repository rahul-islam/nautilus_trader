[package]
name = "nautilus-groww"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Groww integration adapter for the Nautilus trading engine"
categories.workspace = true
keywords.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "nautilus_groww"
crate-type = ["rlib"]

[features]
default = ["high-precision"]
extension-module = [
  "nautilus-common/extension-module",
  "nautilus-core/extension-module",
  "nautilus-live/extension-module",
  "nautilus-model/extension-module",
  "nautilus-network/extension-module",
  "pyo3/extension-module",
  "python",
]
python = [
  "dep:nautilus-system",
  "nautilus-common/python",
  "nautilus-core/python",
  "nautilus-live/python",
  "nautilus-model/python",
  "nautilus-network/python",
  "nautilus-system/python",
  "pyo3",
  "pyo3-stub-gen",
]
high-precision = ["nautilus-model/high-precision"]
examples = ["nautilus-live/node", "nautilus-trading/examples"]

[package.metadata.cargo-machete]
ignored = [
  "nautilus-system",
] # Optional dep activated only via the python feature

[package.metadata.docs.rs]
# Python docs depend on the local pyo3-stub-gen patch for now, which published crates do not carry
features = ["examples", "high-precision"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core = { workspace = true }
nautilus-live = { workspace = true }
nautilus-model = { workspace = true }
nautilus-network = { workspace = true }
nautilus-system = { workspace = true, optional = true }

ahash = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
csv = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
jiff = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
ustr = { workspace = true }
zeroize = { workspace = true }

pyo3 = { workspace = true, optional = true }
pyo3-stub-gen = { workspace = true, optional = true }

[dev-dependencies]
nautilus-testkit = { workspace = true, default-features = false, features = [
  "testers",
] }
nautilus-trading = { workspace = true }

anyhow = { workspace = true }
dotenvy = { workspace = true }
rstest = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "groww-feed-tester"
path = "examples/feed_tester.rs"
doc = false

[[example]]
name = "groww-download-bars"
path = "examples/download_bars.rs"
doc = false

[[example]]
name = "groww-market-data"
path = "examples/market_data.rs"
doc = false

[[example]]
name = "groww-instruments"
path = "examples/instruments.rs"
doc = false

[[example]]
name = "groww-http-private"
path = "examples/http_private.rs"
doc = false
